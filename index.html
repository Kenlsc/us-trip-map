const map = L.map("map", { zoomControl: true, attributionControl: true, tap: true });

const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19,
  attribution: "Tiles © Esri — Esri, HERE, Garmin, USGS, NGA, EPA, USDA, NPS | 路线 OSRM | 充电站 AFDC / NREL（2026-11-14）"

});
esri.addTo(map);

function makeRoute(latlngs, color, className) {
  const solid = L.polyline(latlngs, {
    color, weight: 6, opacity: 0.92, lineJoin: "round", lineCap: "round", interactive: true
  });
  const flow = L.polyline(latlngs, {
    color: "#ffffff", weight: 2.4, opacity: 0.95, lineJoin: "round", lineCap: "round",
    dashArray: "14 26", className: "route-flow " + className, interactive: false
  });
  const group = L.layerGroup([solid, flow]);
  if (typeof L.polylineDecorator === "function") {
    group.addLayer(L.polylineDecorator(solid, {
      patterns: [{
        offset: 60, endOffset: 40, repeat: 140,
        symbol: L.Symbol.arrowHead({
          pixelSize: 14, polygon: true,
          pathOptions: { fillOpacity: 1, weight: 0, color, fillColor: color, interactive: false }
        })
      }]
    }));
  }
  return group;
}

const layerOut = makeRoute(DATA.routes.outbound, COLORS.outbound, "flow-out").addTo(map);
const layerNyc = makeRoute(DATA.routes.nycaa, COLORS.nycaa, "flow-nyc").addTo(map);
const layerRet = makeRoute(DATA.routes.return, COLORS.ret, "flow-ret").addTo(map);

const teslaLayer = L.layerGroup();
const thirdLayer = L.layerGroup();
const stopLayer = L.layerGroup();

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function chargerPopup(c) {
  const isTesla = c.typ === "tesla";
  const stalls = c.stalls ? "，" + c.stalls + " 桩" : "";
  const addr = [c.addr, c.city].filter(Boolean).join("，");
  return '<div class="popup"><h3>' + escapeHtml(c.name) + "</h3>" +
    '<div class="meta">' + escapeHtml(addr) + "</div>" +
    (c.hwy ? '<div class="meta">公路：' + escapeHtml(c.hwy) + "</div>" : "") +
    '<div class="meta">功率：' + escapeHtml(c.power) + stalls + (c.conn ? " · " + escapeHtml(c.conn) : "") + "</div>" +
    '<span class="tag ' + (isTesla ? "tesla" : "third") + '">' + escapeHtml(c.network) + "</span></div>";
}

DATA.chargers.forEach(function (c) {
  const isTesla = c.typ === "tesla";
  L.circleMarker([c.lat, c.lon], {
    radius: 7, color: "#fff", weight: 1.5,
    fillColor: isTesla ? COLORS.tesla : COLORS.third, fillOpacity: 1
  }).bindPopup(chargerPopup(c), { maxWidth: 280 }).addTo(isTesla ? teslaLayer : thirdLayer);
});
teslaLayer.addTo(map);
thirdLayer.addTo(map);

DATA.stops.forEach(function (s) {
  let icon;
  if (s.highlight) {
    icon = L.divIcon({
      className: "",
      html: '<div class="dallas-wrap"><div class="dallas-star">★</div><div class="dallas-num">' + s.n + "</div></div>",
      iconSize: [36, 36], iconAnchor: [18, 20], popupAnchor: [0, -16]
    });
  } else {
    icon = L.divIcon({
      className: "",
      html: '<div class="stop-icon">' + s.n + "</div>",
      iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12]
    });
  }
  const html = '<div class="popup"><h3>' + escapeHtml(s.name) + "</h3>" +
    '<div class="meta">' + escapeHtml(s.city) + "</div>" +
    '<div class="meta">' + escapeHtml(s.dates) + "</div></div>";
  L.marker([s.lat, s.lon], { icon: icon, zIndexOffset: 600 }).bindPopup(html).addTo(stopLayer);
});
stopLayer.addTo(map);

map.fitBounds(L.latLngBounds(DATA.routes.outbound.concat(DATA.routes.nycaa, DATA.routes.return)), { padding: [36, 36] });

map.addControl(new Legend());

document.querySelectorAll("#legend-panel input[data-layer]").forEach(function (box) {
  box.addEventListener("change", function () {
    const layer = layers[box.getAttribute("data-layer")];
    if (!layer) return;
    if (box.checked) map.addLayer(layer); else map.removeLayer(layer);
  });
});
document.querySelectorAll("#legend-panel input[name=basemap]").forEach(function (box) {
  box.addEventListener("change", function () {
    if (!box.checked) return;
    if (box.value === "osm") { map.removeLayer(esri); map.addLayer(osm); }
    else { map.removeLayer(osm); map.addLayer(esri); }
  });
});

L.control.layers({ "Esri 街道图": esri, "OpenStreetMap": osm }, null, { position: "bottomleft", collapsed: true }).addTo(map);

const toggle = document.getElementById("legend-toggle");
const panel = document.getElementById("legend-panel");
function setLegendOpen(open) {
  document.body.classList.toggle("legend-open", open);
  toggle.setAttribute("aria-expanded", open ? "true" : "false");
  const wrap = panel && panel.parentElement;
  if (wrap) wrap.style.display = open || window.matchMedia("(min-width: 641px)").matches ? "" : "none";
}
function syncLegend() {
  setLegendOpen(window.matchMedia("(min-width: 641px)").matches || document.body.classList.contains("legend-open"));
}
toggle.addEventListener("click", function () {
  setLegendOpen(!document.body.classList.contains("legend-open"));
});
window.matchMedia("(min-width: 641px)").addEventListener("change", function (e) {
  if (e.matches) setLegendOpen(true);
  else setLegendOpen(false);
});
syncLegend();
map.invalidateSize();
</script>
</body>
</html>
